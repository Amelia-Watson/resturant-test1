<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Bella Italia</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Login -->
  <div id="loginPage" class="login-page">
    <div class="login-box">
      <h1>🍝 Admin</h1>
      <p class="sub">Bella Italia · Order Management</p>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" value="admin" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" value="admin123" />
      </div>
      <button class="btn btn-primary" style="width:100%" id="loginBtn">Sign In</button>
      <p id="loginError" style="color:var(--danger);margin-top:0.75rem;text-align:center;font-size:0.9rem;display:none;"></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="admin-layout" style="display:none;">
    <aside class="sidebar">
      <div class="brand">🍝 Bella Italia</div>
      <nav>
        <a href="#" class="active" data-view="orders">Orders</a>
        <a href="#" data-view="menu">Menu</a>
        <a href="#" id="logoutBtn">Logout</a>
      </nav>
    </aside>

    <main class="main">
      <!-- Orders View -->
      <div id="ordersView">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:0.75rem;">
          <h2>Orders</h2>
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
            <button class="btn btn-outline btn-sm filter-btn active" data-status="">All</button>
            <button class="btn btn-outline btn-sm filter-btn" data-status="pending">Pending</button>
            <button class="btn btn-outline btn-sm filter-btn" data-status="preparing">Preparing</button>
            <button class="btn btn-outline btn-sm filter-btn" data-status="ready">Ready</button>
            <button class="btn btn-outline btn-sm filter-btn" data-status="completed">Completed</button>
          </div>
        </div>

        <div class="stats" id="stats"></div>

        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Order #</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Time</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Menu View -->
      <div id="menuView" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
          <h2>Menu Items</h2>
          <button class="btn btn-primary" id="addItemBtn">+ Add Item</button>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Available</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="menuBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Menu Modal -->
  <div class="modal" id="menuModal">
    <div class="modal-content" style="text-align:left; max-width:480px;">
      <h2 id="menuModalTitle">Add Menu Item</h2>
      <input type="hidden" id="editId" />
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="itemName" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="itemDesc" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Price *</label>
        <input type="number" id="itemPrice" step="0.01" min="0" />
      </div>
      <div class="form-group">
        <label>Category *</label>
        <input type="text" id="itemCategory" placeholder="Pizza, Pasta, Drinks…" list="catList" />
        <datalist id="catList">
          <option value="Pizza"><option value="Pasta"><option value="Salads">
          <option value="Sides"><option value="Desserts"><option value="Drinks">
        </datalist>
      </div>
      <div style="display:flex;gap:0.75rem;margin-top:1.25rem;">
        <button class="btn btn-primary" id="saveItemBtn" style="flex:1">Save</button>
        <button class="btn btn-outline" id="cancelItemBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
